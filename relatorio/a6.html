<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceDash - Relatório</title>
    <link rel="stylesheet" href="a6.css">
</head>
<body>

    <div class="cima">
        <div class="titulo">
            <p>💰 FinanceDash</p>
        </div>
        <div class="conta">
            <img src="https://i.pinimg.com/474x/a8/da/22/a8da222be70a71e7858bf752065d5cc3.jpg" alt="Perfil">
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="../telaprincipal/a.html">🏠 Início</a></li>
            <li><a href="../receitas/a2.html">💰 Receitas</a></li>
            <li><a href="../despesas/a3.html">💸 Despesas</a></li>
            <li><a href="../graficos/a4.html">📊 Gráficos</a></li>
            <li><a href="../metas/a5.html">🎯 Metas</a></li>
            <li><a href="../relatorio/a6.html">📄 Relatório</a></li>
            <li><a href="../conta/a8.html">👤 Conta</a></li>
            <li><a href="../configuracoes/a7.html">⚙️ Config</a></li>
        </ul>
    </nav>

    <main class="conteudo-principal">
        <div class="container-relatorio">
            <div class="cards-resumo">
                <div class="card-metrica">
                    <h3>Total Receitas</h3>
                    <p id="totalReceitas" class="valor-verde">R$ 0,00</p>
                </div>
                <div class="card-metrica">
                    <h3>Total Despesas</h3>
                    <p id="totalDespesas" class="valor-vermelho">R$ 0,00</p>
                </div>
                <div class="card-metrica">
                    <h3>Saldo Consolidado</h3>
                    <p id="saldoConsolidado" class="valor-neutro">R$ 0,00</p>
                </div>
            </div>

            <div class="card-tabela">
                <div class="cabecalho-tabela">
                    <h2>Histórico de Transações</h2>
                    <button id="btnAtualizarRelatorio" type="button">Atualizar Dados</button>
                </div>
                <div class="tabela-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Categoria</th>
                                <th>Valor</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaCorpo">
                            <tr>
                                <td colspan="4" class="vazio">A carregar dados do relatório...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="a6.js"></script>
</body>
</html>
