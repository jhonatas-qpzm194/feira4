<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Metas</title>
    <link rel="stylesheet" href="a5.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="container-principal">
        <h1>Painel de Metas</h1>

     
        <div class="cards-metas">
            <div class="card">
                <h3>Meta Mensal</h3>
                <p class="valor">R$ 10.000</p>
                <span class="status bom">80% Atingido</span>
            </div>
            <div class="card">
                <h3>Meta Anual</h3>
                <p class="valor">R$ 120.000</p>
                <span class="status medio">45% Atingido</span>
            </div>
        </div>

        
        <div class="area-grafico">
            <canvas id="meuGrafico"></canvas>
        </div>

        
        <div class="navegacao">
            <a href="../telaprincipal/a.html" class="tela">Tela Principal</a>
            <a href="" class="tela btn-meta">Nova Meta</a>
        </div>
    </div>

    <script src="a5.js"></script>
</body>
</html>
