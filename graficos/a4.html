<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceDash - Gráficos</title>
    <link rel="stylesheet" href="a4.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="cima">
        <div class="titulo">
            <p>💰 FinanceDash</p>
        </div>
        <div class="conta">
            <img src="https://i.pinimg.com/474x/a8/da/22/a8da222be70a71e7858bf752065d5cc3.jpg" alt="Perfil">
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="../telaprincipal/a.html">🏠 Início</a></li>
            <li><a href="../receitas/a2.html">💰 Receitas</a></li>
            <li><a href="../despesas/a3.html">💸 Despesas</a></li>
            <li><a href="../graficos/a4.html">📊 Gráficos</a></li>
            <li><a href="../metas/a5.html">🎯 Metas</a></li>
            <li><a href="../relatorio/a6.html">📄 Relatório</a></li>
            <li><a href="../conta/a8.html">👤 Conta</a></li>
            <li><a href="../configuracoes/a7.html">⚙️ Config</a></li>
        </ul>
    </nav>

    <main class="conteudo-principal">
        <div class="grid-graficos">
            <div class="card-painel">
                <h2>Adicionar Dados ao Gráfico</h2>
                <div class="grupo-campo">
                    <label>Categoria ou Mês</label>
                    <input type="text" id="inputRotulo" class="input-dash" placeholder="Ex: Julho ou Alimentação">
                </div>
                <div class="grupo-campo">
                    <label>Valor</label>
                    <input type="text" id="inputValorDado" class="input-dash" placeholder="R$ 0,00">
                </div>
                <button id="btnAdicionarDado" type="button">Atualizar Gráfico</button>
            </div>

            <div class="card-grafico">
                <h2>Balanço Dinâmico</h2>
                <div class="container-canvas">
                    <canvas id="graficoDinamico"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="a4.js"></script>
</body>
</html>
