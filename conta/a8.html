<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceDash - A Minha Conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="a8.css">
</head>

<body>

    <div class="container-pagina">

        <header class="cabecalho-conta">
            <div class="bloco-titulo">
                <div class="badge-icone">
                    <i class="fa-solid fa-address-card"></i>
                </div>
                <div>
                    <h1>A Minha Conta</h1>
                    <p>Consulte as suas informações pessoais e detalhes da subscrição</p>
                </div>
            </div>
            <a href="../configuracoes/a7.html" class="btn-acao-principal">
                <i class="fa-solid fa-pen-to-square"></i> Editar Perfil
            </a>
        </header>

        <div class="cartao-perfil-topo">
            <div class="avatar-container">
                <img id="fotoPerfil" src="" alt="Foto de Perfil">
                <button class="btn-mudar-foto" title="Alterar Foto">
                    <i class="fa-solid fa-camera"></i>
                </button>
            </div>
            <div class="info-perfil-resumo">
                <h2 id="exibicaoNome"></h2>
                <p id="exibicaoEmail"></p>
                <span class="badge-plano" id="exibicaoPlano"><i class="fa-solid fa-crown"></i> <span id="badgeTextoPlano"></span></span>
            </div>
        </div>

        <div class="painel-principal">

            <section class="secao-info">
                <div class="secao-titulo">
                    <i class="fa-solid fa-id-card"></i>
                    <h2>Informações Pessoais</h2>
                </div>
                <div class="grid-detalhes">
                    <div class="item-detalhe">
                        <span class="rotulo">Nome Completo</span>
                        <span class="valor" id="infoNome"></span>
                    </div>
                    <div class="item-detalhe">
                        <span class="rotulo">E-mail</span>
                        <span class="valor" id="infoEmail"></span>
                    </div>
                    <div class="item-detalhe">
                        <span class="rotulo">Telefone / Telemóvel</span>
                        <span class="valor" id="infoTelefone"></span>
                    </div>
                    <div class="item-detalhe">
                        <span class="rotulo">Membro Desde</span>
                        <span class="valor" id="infoDataMembro"></span>
                    </div>
                </div>
            </section>

            <section class="secao-info">
                <div class="secao-titulo">
                    <i class="fa-solid fa-credit-card"></i>
                    <h2>Subscrição & Plano</h2>
                </div>
                <div class="cartao-plano">
                    <div class="detalhe-plano">
                        <h4>Plano Atual: <strong id="nomePlano"></strong></h4>
                        <p>Renovação automática em: <span id="dataRenovacao"></span></p>
                    </div>
                    <button class="btn-secundario">
                        <i class="fa-solid fa-arrows-rotate"></i> Gerir Subscrição
                    </button>
                </div>
            </section>

        </div>

        <div class="navegacao">
            <a href="../telaprincipal/a.html" class="btn-voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>

    </div>

    <script src="a8.js"></script>

</body>

</html>
