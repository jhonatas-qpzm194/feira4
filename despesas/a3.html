<!DOCTYPE html>
<html lang="pt-BR">

    <title>FinanceDash - Despesas</title>
    <link rel="stylesheet" href="a3.css">
</head>
<body>

    <div class="cima">
        <div class="titulo">
            <p>💰 FinanceDash</p>
        </div>
        <div class="conta">
            <img src="https://i.pinimg.com/474x/a8/da/22/a8da222be70a71e7858bf752065d5cc3.jpg" alt="Perfil">
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="../telaprincipal/a.html">🏠 Início</a></li>
            <li><a href="../receitas/a2.html">💰 Receitas</a></li>
            <li><a href="../despesas/a3.html">💸 Despesas</a></li>

            <li><a href="../relatorio/a6.html">📄 Relatório</a></li>

    <main class="conteudo-principal">
        <div class="card-painel">
            <h2>Gerir Despesas</h2>
            <div class="grupo-campo">
                <label>Descrição da Despesa</label>
                <input type="text" id="inputDescricaoDespesa" class="input-dash" placeholder="Ex: Aluguer, Supermercado, Contas">
            </div>
            <div class="grupo-campo">
                <label>Valor</label>
                <input type="text" id="inputValorDespesa" class="input-dash" placeholder="R$ 0,00">
            </div>
            <button id="btnGuardarDespesa" type="button">Salvar Despesa</button>
        </div>
    </main>

    <script src="a3.js"></script>
</body>
</html>
